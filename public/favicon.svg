<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200">
  <defs>
    <style>
      .outer-ring { fill: none; stroke: #d32f2f; stroke-width: 8; }
      .inner-circle { fill: #8B1A1A; }
      .inner-ring { fill: none; stroke: #d32f2f; stroke-width: 5; }
      .shield { fill: #8B1A1A; stroke: #d32f2f; stroke-width: 3; }
      .circuit { fill: none; stroke: #d32f2f; stroke-width: 1.5; stroke-linecap: round; }
      .dot { fill: none; stroke: #d32f2f; stroke-width: 1.2; }
      .text { font-family: Georgia, serif; font-weight: bold; fill: #F5DEB3; }
      .top-text { font-size: 9px; letter-spacing: 0.8px; }
      .bottom-text { font-size: 9px; letter-spacing: 0.8px; }
    </style>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="#f5f5f5"/>
  
  <!-- Outer bright red circle -->
  <circle cx="100" cy="100" r="97" class="outer-ring"/>
  
  <!-- Dark background circle -->
  <circle cx="100" cy="100" r="92" class="inner-circle"/>
  
  <!-- Inner red ring -->
  <circle cx="100" cy="100" r="88" class="inner-ring"/>
  
  <!-- Shield -->
  <path d="M 100 55 L 135 72 L 135 95 Q 100 118 100 118 Q 100 118 65 95 L 65 72 Z" class="shield"/>
  
  <!-- Shield grid lines -->
  <line x1="100" y1="60" x2="100" y2="115" class="circuit"/>
  <line x1="75" y1="88" x2="125" y2="88" class="circuit"/>
  
  <!-- Left circuit traces -->
  <line x1="60" y1="65" x2="50" y2="55" class="circuit"/>
  <circle cx="50" cy="55" r="2" class="dot"/>
  
  <line x1="55" y1="85" x2="40" y2="85" class="circuit"/>
  <circle cx="40" cy="85" r="2" class="dot"/>
  
  <line x1="58" y1="105" x2="42" y2="118" class="circuit"/>
  <circle cx="42" cy="118" r="2" class="dot"/>
  
  <!-- Right circuit traces -->
  <line x1="140" y1="65" x2="150" y2="55" class="circuit"/>
  <circle cx="150" cy="55" r="2" class="dot"/>
  
  <line x1="145" y1="85" x2="160" y2="85" class="circuit"/>
  <circle cx="160" cy="85" r="2" class="dot"/>
  
  <line x1="142" y1="105" x2="158" y2="118" class="circuit"/>
  <circle cx="158" cy="118" r="2" class="dot"/>
  
  <!-- NIAT text in shield -->
  <text x="88" y="95" font-size="14" font-weight="bold" fill="#F5DEB3" text-anchor="middle">N</text>
  <text x="112" y="95" font-size="14" font-weight="bold" fill="#F5DEB3" text-anchor="middle">I</text>
  <text x="88" y="112" font-size="14" font-weight="bold" fill="#F5DEB3" text-anchor="middle">A</text>
  <text x="112" y="112" font-size="14" font-weight="bold" fill="#F5DEB3" text-anchor="middle">T</text>
  
  <!-- Text on circle - ADVANCED (top) -->
  <path id="topCurve" d="M 55,100 A 45,45 0 0,1 145,100" fill="none"/>
  <text class="text top-text" text-anchor="middle">
    <textPath href="#topCurve" startOffset="50%">ADVANCED</textPath>
  </text>
  
  <!-- Text on circle - TECH CLUB (bottom) -->
  <path id="bottomCurve" d="M 145,100 A 45,45 0 0,1 55,100" fill="none"/>
  <text class="text bottom-text" text-anchor="middle">
    <textPath href="#bottomCurve" startOffset="50%">TECH CLUB</textPath>
  </text>
</svg>